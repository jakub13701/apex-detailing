<!DOCTYPE html>
<html lang="cs" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Detailing | Prémiová péče o váš vůz v Praze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfeff', 100: '#cffafe', 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2', accent: '#00f0ff', dark: '#080c14', card: '#0f172a', border: '#1e293b'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #070a10; color: #f1f5f9; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(7, 10, 16, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-glow { box-shadow: 0 0 25px rgba(6, 182, 212, 0.25); }
        .text-gradient { background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #00f0ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .text-gradient-cyan { background: linear-gradient(135deg, #38bdf8 0%, #00f0ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="antialiased text-slate-200">
    <header class="fixed top-0 left-0 right-0 z-50 glass-nav h-20 flex items-center justify-between px-8">
        <span class="text-xl font-black text-white tracking-wider">APEX <span class="text-cyan-400">DETAILING</span></span>
        <a href="#kontakt" class="bg-cyan-500 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm">Nezávazná poptávka</a>
    </header>
    <section class="pt-40 pb-24 text-center max-w-4xl mx-auto px-4">
        <div class="inline-block px-4 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-semibold tracking-wide mb-6">
            PROFESIONÁLNÍ NÁVRH WEBU PRO VAŠI FIRMU
        </div>
        <h1 class="text-4xl sm:text-6xl font-black tracking-tight leading-tight">
            Posuňte prezentaci vaší myčky na <span class="text-gradient">vyšší úroveň</span>
        </h1>
        <p class="text-slate-400 text-lg mt-6 max-w-2xl mx-auto">
            Připravil jsem pro vás ukázkový moderní web s interaktivním kalkulátorem cen, živým srovnáním před/po a rychlou rezervací.
        </p>
        <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4">
            <a href="tel:+420777123456" class="bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 font-extrabold px-8 py-4 rounded-xl shadow-lg">
                <i class="fa-solid fa-phone mr-2"></i> Zavolat: +420 777 123 456
            </a>
        </div>
    </section>
</body>
</html>
